# Tool configuration only; runtime dependencies are in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Same rule set as Personal-CI-CD.
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = [
    "E501", # the page templates are long HTML strings; the formatter owns code line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests"]
